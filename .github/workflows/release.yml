name: release

# Never publish on push, merge, or tag creation.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version in pyproject.toml"
        required: true
        default: "0.1.1"
        type: string
      publish_to_pypi:
        description: "Publish to PyPI (only on master; default is build-only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package identity, version and publish branch
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH_TO_PYPI: ${{ inputs.publish_to_pypi }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "vaillant-netatmo-api-ng", "Unexpected package name"
          assert project["version"] == os.environ["EXPECTED_VERSION"], "Unexpected package version"
          if os.environ["PUBLISH_TO_PYPI"] == "true":
              assert os.environ["GITHUB_REF"] == "refs/heads/master", (
                  "Publishing is allowed only from master"
              )
          print(f"Validated {project['name']}=={project['version']}")
          PY
      - name: Install build and validation tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify distribution metadata
        run: python -m twine check dist/*
      - name: Upload checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish approved release to PyPI
    needs: build
    if: ${{ inputs.publish_to_pypi && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/vaillant-netatmo-api-ng/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
