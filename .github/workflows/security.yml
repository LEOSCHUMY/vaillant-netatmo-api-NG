name: Dependency security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    name: Audit resolved runtime dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install runtime in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-runtime"
          "$RUNNER_TEMP/vsmart-runtime/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vsmart-runtime/bin/python" -m pip install .
      - name: Install audit tooling separately
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-audit"
          "$RUNNER_TEMP/vsmart-audit/bin/python" -m pip install -r requirements-audit.txt
      - name: Snapshot installed external runtime dependencies
        run: |
          "$RUNNER_TEMP/vsmart-runtime/bin/python" - "$RUNNER_TEMP/runtime-dependencies.txt" <<'PY'
          from importlib.metadata import distributions
          from pathlib import Path
          import sys

          requirements = sorted(
              f"{dist.metadata['Name']}=={dist.version}"
              for dist in distributions()
              if dist.metadata["Name"].lower().replace("_", "-") != "vaillant-netatmo-api-ng"
          )
          Path(sys.argv[1]).write_text("\n".join(requirements) + "\n", encoding="utf-8")
          print(f"Auditing {len(requirements)} installed external dependencies")
          PY
      - name: Audit without vulnerability exclusions
        run: |
          "$RUNNER_TEMP/vsmart-audit/bin/python" -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/runtime-dependencies.txt"
