name: tests

on:
  push:
    branches: [ master, "diagnostic/**" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Verify direct dependency minimums
        if: matrix.python-version == '3.12'
        run: python -m pip install httpx==0.27.0 tenacity==8.5.0
      - name: Check Python syntax and undefined names
        run: flake8 . --jobs=1 --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: pytest

  package-build:
    name: Validate NG package build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Verify package identity and version
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "vaillant-netatmo-api-ng"
          assert project["version"] == "0.2.0"
          print(f"Validated {project['name']}=={project['version']}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
