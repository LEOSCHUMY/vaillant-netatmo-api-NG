[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "vaillant-netatmo-api-ng"
version = "0.1.1"
authors = [
    { name="Mislav Mandaric" },
]
description = "Community fork for managing Vaillant thermostats using Netatmo-backed APIs."
readme = "README.md"
maintainers = [
    { name="LEOSCHUMY" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<0.29",
    "tenacity>=8.5.0,<10",
    # Security floors for HTTPX transitive dependencies (also enforced for consumers).
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.18",
    "httpcore>=1.0.9,<2",
    "idna>=3.15,<4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/LEOSCHUMY/vaillant-netatmo-api-NG"
Source = "https://github.com/LEOSCHUMY/vaillant-netatmo-api-NG"
Issues = "https://github.com/LEOSCHUMY/vaillant-netatmo-api-NG/issues"
Changelog = "https://github.com/LEOSCHUMY/vaillant-netatmo-api-NG/blob/master/CHANGELOG.md"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
major_on_zero = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
